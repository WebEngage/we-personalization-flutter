group = 'com.webengage.we_personalization_flutter'
version = '2.2.0'

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
def builtInKotlin = providers.gradleProperty("android.builtInKotlin")
        .map { it.toBoolean() }
        .orElse(agpMajor >= 9)
        .get()
if (agpMajor < 9 || !builtInKotlin) {
    apply plugin: 'kotlin-android'
}

android {
    compileSdk = 34
    namespace = 'com.webengage.we_personalization_flutter'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main.java.srcDir 'src/main/kotlin'
    }

    defaultConfig {
        minSdk = 21
    }
}

plugins.withId("org.jetbrains.kotlin.android") {
    def kotlinExtension = project.extensions.getByName("kotlin")
    if (kotlinExtension.hasProperty("compilerOptions")) {
        kotlinExtension.compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8)
    } else {
        android.kotlinOptions.jvmTarget = '1.8'
    }
}

dependencies{
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    api 'net.sourceforge.htmlcleaner:htmlcleaner:2.26'
    api 'com.webengage:we-personalization:[1,)'
}